[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    # Deliberate: search and the LLM/vector/keyword paths must degrade gracefully (fall back, return 503)
    # instead of turning an unexpected failure into a 500, so broad `except Exception` is intended.
    "BLE001",
    # dict(key=value) is used on purpose where it reads better than a quoted-key literal.
    "C408",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...) and Query(...) in argument defaults are the framework's idiom, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Style-only rules that add noise to test code (naive dates as fixtures, nested `with`, unused unpacking).
"tests/**" = ["DTZ001", "SIM117", "RUF059"]
