services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fashion_rec_db
    environment:
      - POSTGRES_DB=fashion_rec
      - POSTGRES_USER=fashion_rec
      - POSTGRES_PASSWORD=dev_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion_rec -d fashion_rec"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fashion_rec_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # No published port: the app reaches it on the compose network, and a host
  # Ollama install may already be using 11434.
  ollama:
    image: ollama/ollama:latest
    container_name: fashion_rec_ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: downloads the model into the shared volume (no-op once present).
  ollama-pull:
    image: ollama/ollama:latest
    container_name: fashion_rec_ollama_pull
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-tinyllama}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    container_name: fashion_rec_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://fashion_rec:dev_password@db:5432/fashion_rec
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  pg_data:
  ollama_data: