services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fashion_rec_db
    environment:
      - POSTGRES_DB=fashion_rec
      - POSTGRES_USER=fashion_rec
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion_rec -d fashion_rec"]
      interval: 10s
      timeout: 5s
      retries: 5

  # No published port: the app reaches it on the compose network, and a host
  # Ollama install may already be using 11434.
  ollama:
    image: ollama/ollama:latest
    container_name: fashion_rec_ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: downloads the model into the shared volume (no-op once present).
  ollama-pull:
    image: ollama/ollama:latest
    container_name: fashion_rec_ollama_pull
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma3:1b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # One-shot: creates or updates the database schema before the API starts.
  migrate:
    build: .
    image: fashion-rec-backend
    container_name: fashion_rec_migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+psycopg://fashion_rec:${POSTGRES_PASSWORD}@db:5432/fashion_rec
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: fashion-rec-backend
    container_name: fashion_rec_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://fashion_rec:${POSTGRES_PASSWORD}@db:5432/fashion_rec
      - OLLAMA_BASE_URL=http://ollama:11434
      # Ollama on CPU takes ~8 s per query (about 1 s on a GPU), so give it more time than the 8 s default.
      - LLM_QUERY_UNDERSTANDING_TIMEOUT_SECONDS=${LLM_QUERY_UNDERSTANDING_TIMEOUT_SECONDS:-25}
      - LOG_FORMAT=json
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully

  # NEXT_PUBLIC_API_URL is baked in at build time: it is the address the
  # *browser* uses to reach the API, so it is the host-published port.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: fashion_rec_frontend
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pg_data:
  ollama_data: